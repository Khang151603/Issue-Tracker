<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Issue tracker interface mockup." />
    <title>Issue Tracker</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Issue Tracker</h1>
      </header>

      <section aria-label="Create issue" class="create-section">
        <form id="todo-form" class="issue-form">
          <label class="form-field">
            <span>Title</span>
            <input id="todo-title" name="title" type="text" placeholder="Title ..." class="form-input" required />
          </label>

          <label class="form-field">
            <span>Author</span>
            <select id="todo-author" name="author" class="form-input">
              <option>Khang</option>
              <option>Ronaldo</option>
              <option>Messi</option>
            </select>
          </label>

          <label class="form-field">
            <span>Severity</span>
            <select id="todo-severity" name="severity" class="form-input severity-input">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </label>

          <div class="add-wrapper">
            <button id="add-button" type="submit" class="button add-button">Add</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="issues-title" class="issues-section">
        <div class="issues-heading">
          <h2 id="issues-title">List Issue</h2>
          <label class="search-field">
            <span class="sr-only">Search by description</span>
            <input type="search" placeholder="Search by description" class="search-input" />
          </label>
        </div>

        <div class="filter-row">
          <span>Filter:</span>
          <div class="filter-buttons">
            <button type="button" class="button filter-button all-button">All</button>
            <button type="button" class="button filter-button open-button">Open</button>
            <button type="button" class="button filter-button closed-button">Close</button>
          </div>
        </div>

        <label class="order-field">
          <span>Order By:</span>
          <select class="order-select">
            <option>Choose...</option>
            <option>ASC</option>
            <option>DESC</option>
          </select>
        </label>

        <div id="todo-list" class="issue-list" aria-live="polite"></div>

      </section>
    </main>
  </body>
</html>
