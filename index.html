<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Issue tracker interface mockup." />
    <title>Issue Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Issue Tracker</h1>
      </header>

      <section aria-label="Create issue" class="create-section">
        <form class="issue-form">
          <label class="form-field">
            <span>Title</span>
            <input type="text" placeholder="Title ..." class="form-input" />
          </label>

          <label class="form-field">
            <span>Author</span>
            <select class="form-input">
              <option>Khang</option>
              <option>Ronaldo</option>
              <option>Messi</option>
            </select>
          </label>

          <label class="form-field">
            <span>Severity</span>
            <select class="form-input severity-input">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </label>

          <div class="add-wrapper">
            <button type="button" class="button add-button">Add</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="issues-title" class="issues-section">
        <div class="issues-heading">
          <h2 id="issues-title">List Issue</h2>
          <label class="search-field">
            <span class="sr-only">Search by description</span>
            <input type="search" placeholder="Search by description" class="search-input" />
          </label>
        </div>

        <div class="filter-row">
          <span>Filter:</span>
          <div class="filter-buttons">
            <button type="button" class="button filter-button all-button">All</button>
            <button type="button" class="button filter-button open-button">Open</button>
            <button type="button" class="button filter-button closed-button">Close</button>
          </div>
        </div>

        <label class="order-field">
          <span>Order By:</span>
          <select class="order-select">
            <option>Choose...</option>
            <option>ASC</option>
            <option>DESC</option>
          </select>
        </label>

        <div class="issue-list">
          <article class="issue-card">
            <div class="issue-card-header">
              <span>1</span><span class="status-badge">new</span>
            </div>
            <div class="issue-card-body">
              <h3>delectus aut autem</h3>
              <div class="issue-actions">
                <button type="button" class="button close-button">Close</button>
                <button type="button" class="button delete-button">Delete</button>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
